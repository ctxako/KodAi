<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kodAI — Riverview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04091a; --ink: #EAF2F5; --blue: #47d1ef; --dim: #7C93A6;
    --fork: #ba7aff; --amber: #F2C45A; --gold: #FFD233; --rose: #F561B0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Space Grotesk", system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; }

  /* header */
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: rgba(0,0,0,.28); flex-shrink: 0;
    border-bottom: 1px solid rgba(71,209,239,.12);
  }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  .wordmark { font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
  .wordmark b { color: var(--blue); }
  .header-sub { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--dim); }
  .header-spacer { flex: 1; }
  .header-btn {
    background: rgba(255,255,255,.06); border: none; color: rgba(255,255,255,.8);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; transition: background .2s;
  }
  .header-btn:hover { background: rgba(255,255,255,.12); }
  .header-btn.active { color: var(--blue); }

  /* legend */
  .legend {
    padding: 9px 16px; background: rgba(0,0,0,.68);
    border: 1px solid rgba(71,209,239,.18); border-radius: 14px;
    margin: 8px 12px 0; flex-shrink: 0; z-index: 2;
  }
  .legend-head { font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 600; letter-spacing: .8px; color: rgba(71,209,239,.76); text-transform: uppercase; margin-bottom: 7px; }
  .legend-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-item .ico { font-size: 11px; width: 15px; text-align: center; flex-shrink: 0; }
  .legend-item .lbl { font-size: 9px; font-weight: 500; color: rgba(255,255,255,.76); }
  .legend-item .det { font-size: 8px; color: rgba(255,255,255,.38); }

  /* scrolling river */
  .scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    scrollbar-width: thin; scrollbar-color: rgba(71,209,239,.3) transparent;
  }
  .scroll::-webkit-scrollbar { width: 4px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(71,209,239,.3); border-radius: 2px; }
  .canvas-wrap { position: relative; }
  .canvas-wrap canvas { display: block; width: 100%; pointer-events: none; }

  /* playhead */
  .playhead { position: sticky; top: 50%; left: 0; right: 0; height: 0; z-index: 2; pointer-events: none; }
  .playhead-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); }

  /* token labels */
  .tok-label {
    position: absolute; font-family: "IBM Plex Mono", monospace; font-size: 12px;
    color: rgba(255,255,255,.42); white-space: nowrap; transform: translateX(-50%);
    pointer-events: auto; cursor: pointer; transition: color .15s, font-size .15s;
  }
  .tok-label.active {
    font-size: 17px; font-weight: 600; color: #fff;
    padding: 5px 9px; background: rgba(0,0,0,.74);
    border: 1px solid rgba(71,209,239,.34); border-radius: 20px;
  }

  /* card */
  .card {
    flex-shrink: 0; padding: 14px 16px; margin: 8px 12px 12px;
    background: linear-gradient(135deg, rgba(6,28,43,.96), rgba(0,0,0,.94));
    border: 1px solid rgba(71,209,239,.28); border-radius: 22px; color: #fff;
  }
  .card-head { display: flex; align-items: baseline; gap: 10px; }
  .card-tok { font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 700; }
  .card-raw { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: rgba(255,255,255,.38); }
  .card-spacer { flex: 1; }
  .card-prob { font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 600; }
  .card-prob-lbl { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: rgba(255,255,255,.38); margin-left: 4px; }
  .card-sub { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: rgba(255,255,255,.38); margin-top: 4px; }
  .card-ctx { font-family: "IBM Plex Mono", monospace; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.62); margin-top: 8px; }
  .card-ctx b { color: #fff; font-weight: 600; }
  .card-insight { font-size: 12px; line-height: 1.5; color: rgba(255,255,255,.76); margin-top: 6px; display: flex; align-items: flex-start; gap: 6px; }
  .card-insight .i-ico { color: var(--blue); flex-shrink: 0; font-size: 12px; margin-top: 2px; }
  .card-insight.diverged .i-ico { color: var(--fork); }

  .card-metrics { display: flex; gap: 7px; margin-top: 9px; }
  .card-metric { flex: 1; padding: 7px 8px; background: rgba(255,255,255,.055); border-radius: 9px; }
  .card-metric-val { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.9); }
  .card-metric-lbl { font-size: 9px; color: rgba(255,255,255,.42); margin-top: 2px; }

  /* alternatives */
  .alts-btn {
    display: flex; align-items: center; gap: 6px; margin-top: 9px;
    background: none; border: none; color: rgba(71,209,239,.9); cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 500; padding: 0; width: 100%; text-align: left;
  }
  .alts-btn:hover { color: var(--blue); }
  .alts-hint { font-family: "IBM Plex Mono", monospace; font-size: 9px; color: rgba(255,255,255,.34); margin-left: auto; }
  .alts-panel { margin-top: 10px; display: none; }
  .alts-panel.open { display: block; }
  .alts-head { font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; color: rgba(255,255,255,.52); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 6px; }
  .alt-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .alt-text { font-family: "IBM Plex Mono", monospace; font-size: 11px; min-width: 60px; color: rgba(255,255,255,.5); }
  .alt-text.sel { color: rgba(255,255,255,.9); }
  .alt-text.top { color: var(--fork); }
  .alt-bar { flex: 1; height: 5px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; }
  .alt-fill { height: 100%; border-radius: 2px; }
  .alt-fill.sel { background: rgba(71,209,239,.72); }
  .alt-fill.top { background: rgba(186,122,255,.72); }
  .alt-fill.other { background: rgba(255,255,255,.18); }
  .alt-badge { font-family: "IBM Plex Mono", monospace; font-size: 8px; font-weight: 500; min-width: 36px; text-align: right; }
  .alt-p { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: rgba(255,255,255,.42); min-width: 32px; text-align: right; }
  .argmax-note { font-family: "IBM Plex Mono", monospace; font-size: 11px; line-height: 1.5; color: var(--gold); margin-top: 6px; }
  .argmax-note .diamond { font-size: 8px; margin-right: 4px; }
  .card-sep { border: none; border-top: 1px solid rgba(255,255,255,.12); margin: 8px 0; }

  /* load / dock */
  .dock {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 6px 14px; background: rgba(4,9,26,.82); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(71,209,239,.12);
  }
  .dock .btn {
    cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
    background: rgba(71,209,239,.12); border: 1px solid rgba(71,209,239,.35);
    border-radius: 9px; padding: 7px 11px; transition: .2s; white-space: nowrap;
  }
  .dock .btn:hover { background: rgba(71,209,239,.22); border-color: var(--blue); }
  .dock .trace-info { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--dim); }

  @media (max-width: 680px) {
    .legend { display: none; }
    .card { margin: 4px 6px 8px; padding: 12px; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="wordmark">kod<b>AI</b> — Riverview</div>
      <div class="header-sub" id="headerSub">Decision 1 of 35 · scroll to follow</div>
    </div>
    <div class="header-spacer"></div>
    <button class="header-btn active" id="legendBtn" title="Toggle legend">&#9432;</button>
    <button class="header-btn" id="loadBtn" title="Load trace">&uarr;</button>
  </div>

  <div class="legend" id="legend">
    <div class="legend-head">How to read the current</div>

    <div class="playhead"><div class="playhead-line"></div></div>

  <div class="card" id="card">
    <div class="card-head">

      <span id="cardInsightText"></span>
    </div>
    <div class="card-metrics" id="cardMetrics"></div>
    <button class="alts-btn" id="altsBtn">
      <span>&#10070;</span> Compare alternate currents
      <span class="alts-hint" id="altsHint"></span>
    </button>
    <div class="alts-panel" id="altsPanel">
      <div class="argmax-note" id="argmax" style="display:none"></div>
      <hr class="card-sep">
      <div class="alts-head">top candidates before sampling</div>
      <div id="altsRows"></div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none">

<script>
(function(){
"use strict";

var A=function(id,t,p,sel){return{tokenID:id,text:t,probability:p,isSelected:sel}};
var T=function(step,text,p,e,m,alts){return{step:step,text:text,selectedProbability:p,entropy:e,margin:m,alternatives:alts}};

var SAMPLE={
  prompt:"What is the capital of France?",
  response:"The capital of France is Paris, a city known for its history, art, and the iconic Eiffel Tower. It is home to the Louvre and Notre-Dame.",

    T(5," Paris",.94,.32,.80,[A(6342," Paris",.94,true),A(9441," Lyon",.03,false),A(8891," Marseille",.01,false)]),
    T(6,",",.68,1.28,.24,[A(11,",",.68,true),A(13,".",.42,false),A(0,"!",.01,false)]),
    T(7," a",.42,2.10,.06,[A(314," the",.48,false),A(257," a",.42,true),A(526," one",.04,false),A(853," which",.02,false)]),
    T(8," city",.61,1.52,.18,[A(3736," city",.61,true),A(8275," vibrant",.12,false),A(3407," beautiful",.08,false),A(9122," major",.05,false)]),
    T(9," known",.55,1.68,.16,[A(3967," known",.55,true),A(4786," renowned",.15,false),A(8134," famous",.09,false),A(2060," celebrated",.06,false)]),
    T(10," for",.82,.88,.48,[A(363," for",.82,true),A(355," as",.12,false),A(515," world",.02,false)]),
    T(11," its",.78,.95,.42,[A(967," its",.78,true),A(262," the",.10,false),A(449," being",.04,false)]),
    T(12," history",.35,2.50,.03,[A(5765," rich",.38,false),A(2106," history",.35,true),A(4419," beauty",.09,false),A(6131," deep",.07,false),A(3912," long",.04,false)]),
    T(13,",",.58,1.62,.15,[A(11,",",.58,true),A(290," and",.22,false),A(13,".",.08,false)]),
    T(14," art",.36,2.45,.05,[A(3396," art",.36,true),A(6891," culture",.31,false),A(8723," architecture",.12,false),A(4055," food",.07,false)]),
    T(15,",",.72,1.12,.30,[A(11,",",.72,true),A(290," and",.18,false),A(13,".",.04,false)]),
    T(16," and",.85,.72,.55,[A(290," and",.85,true),A(11,",",.06,false),A(267," or",.03,false)]),
    T(17," the",.88,.58,.64,[A(262," the",.88,true),A(967," its",.08,false),A(257," a",.02,false)]),
    T(18," iconic",.32,2.60,.04,[A(8723," famous",.36,false),A(17834," iconic",.32,true),A(5112," renowned",.10,false),A(3396," legendary",.07,false),A(2060," celebrated",.05,false)]),
    T(19," Eiff",.82,.85,.50,[A(28417," Eiff",.82,true),A(19283," Eiffel",.10,false),A(5765," Arc",.03,false)]),
    T(20,"el",.98,.06,.96,[A(301,"el",.98,true),A(295,"le",.01,false)]),
    T(21," Tower",.95,.22,.85,[A(14229," Tower",.95,true),A(11," tower",.02,false),A(13,",",.01,false)]),
    T(22,".",.72,1.20,.28,[A(13,".",.72,true),A(11,",",.15,false),A(290," and",.06,false)]),
    T(23," It",.45,2.05,.10,[A(198,"\n",.52,false),A(632," It",.45,true),A(383," The",.08,false),A(450,"The",.04,false)]),
    T(24," is",.72,1.08,.32,[A(338," is",.72,true),A(468," has",.18,false),A(338," was",.05,false)]),
    T(25," home",.38,2.30,.04,[A(1126," also",.42,false),A(1544," home",.38,true),A(314," the",.08,false),A(853," known",.04,false)]),
    T(26," to",.93,.35,.78,[A(271," to",.93,true),A(315," of",.03,false),A(290," for",.01,false)]),
    T(27," the",.86,.65,.56,[A(262," the",.86,true),A(4528," many",.05,false),A(6218," numerous",.03,false)]),
    T(28," Lo",.62,1.48,.20,[A(8122," Lo",.62,true),A(28417," Mus",.12,false),A(5765," Arc",.08,false),A(14229," Not",.06,false)]),
    T(29,"uvre",.97,.10,.92,[A(19283,"uvre",.97,true),A(301,"u",.01,false)]),
    T(30," and",.68,1.25,.22,[A(290," and",.68,true),A(11,",",.14,false),A(13,".",.10,false)]),
    T(31," Notre",.55,1.72,.15,[A(32891," Notre",.55,true),A(262," the",.15,false),A(14229," Sacr",.08,false),A(28417," Ver",.06,false)]),
    T(32,"-",.92,.38,.78,[A(12,"-",.92,true),A(18," ",.04,false)]),
    T(33,"Dame",.96,.16,.88,[A(41028,"Dame",.96,true),A(301,"dame",.02,false)]),
    T(34,".",.85,.72,.52,[A(13,".",.85,true),A(11,",",.06,false),A(290," and",.03,false)])

};

var trace=SAMPLE;
var ROW_H=104;
var activeIdx=0;
var legendVisible=true;
var altsOpen=false;

function readableText(t){if(t==="\n")return"newline";var s=t.trim();return s||"space";}
function pct(v){return Math.round(Math.max(0,v)*100);}
function tokenDiverges(tok){return tok.alternatives.length>0&&!tok.alternatives[0].isSelected;}
function rawArgmax(tok){return tok.alternatives.length>0?tok.alternatives[0]:null;}

function confidenceCSS(prob){
  var p=Math.max(0,Math.min(1,prob));
  return"rgb("+Math.round((0.98-0.64*p)*255)+","+Math.round((0.58+0.30*p)*255)+","+Math.round((0.24+0.60*p)*255)+")";
}
function confidenceRGBA(prob,alpha){
  var p=Math.max(0,Math.min(1,prob));
  return"rgba("+Math.round((0.98-0.64*p)*255)+","+Math.round((0.58+0.30*p)*255)+","+Math.round((0.24+0.60*p)*255)+","+alpha+")";
}

function computeNodes(tokens){
  var nodes=[],drift=0,forkDir=1;
  for(var i=0;i<tokens.length;i++){
    var tok=tokens[i],diverges=tokenDiverges(tok);
    var gap=Math.max(0,(diverges&&tok.alternatives[0]?tok.alternatives[0].probability:tok.selectedProbability)-tok.selectedProbability);
    var forkStrength=Math.min(1,gap/0.5);
    var impulse=diverges?forkDir*(0.07+0.10*forkStrength):0;
    if(diverges)forkDir*=-1;
    drift=drift*0.72+impulse;
    drift=Math.min(0.22,Math.max(-0.22,drift));
    nodes.push({step:tok.step,x:0.5+drift,channel:Math.min(1,tok.entropy/4.0)});
  }
  return nodes;
}

function drawRiver(canvas,tokens,nodes,activeIndex){
  var dpr=Math.min(devicePixelRatio,2);
  var wrap=document.getElementById("canvasWrap");
  var w=wrap.clientWidth;
  var totalH=ROW_H*tokens.length;
  canvas.width=w*dpr;canvas.height=totalH*dpr;
  canvas.style.width=w+"px";canvas.style.height=totalH+"px";
  var ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,totalH);
  if(nodes.length<2)return;

  function cx(i){return nodes[i].x*w;}
  function cy(i){return ROW_H*(i+0.5);}
  function halfW(i){return 5+(w*0.26-5)*nodes[i].channel;}
  function emphasis(i){return activeIndex==null?1:Math.max(0.12,1-Math.abs(i-activeIndex)/6);}

  // Channel fill
  ctx.beginPath();ctx.moveTo(cx(0)-halfW(0),cy(0));
  for(var i=1;i<nodes.length;i++){var px=(cx(i-1)-halfW(i-1)+cx(i)-halfW(i))/2;var py=(cy(i-1)+cy(i))/2;ctx.quadraticCurveTo(cx(i-1)-halfW(i-1),cy(i-1),px,py);}
  ctx.lineTo(cx(nodes.length-1)-halfW(nodes.length-1),cy(nodes.length-1));
  ctx.lineTo(cx(nodes.length-1)+halfW(nodes.length-1),cy(nodes.length-1));
  for(var j=nodes.length-2;j>=0;j--){var px2=(cx(j+1)+halfW(j+1)+cx(j)+halfW(j))/2;var py2=(cy(j+1)+cy(j))/2;ctx.quadraticCurveTo(cx(j+1)+halfW(j+1),cy(j+1),px2,py2);}
  ctx.closePath();
  var grad=ctx.createLinearGradient(0,0,0,totalH);grad.addColorStop(0,"rgba(71,209,239,.22)");grad.addColorStop(1,"rgba(186,122,255,.07)");
  ctx.fillStyle=grad;ctx.fill();

  // Channel edges
  ctx.strokeStyle="rgba(71,209,239,.12)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx(0)-halfW(0),cy(0));for(var k=1;k<nodes.length;k++)ctx.lineTo(cx(k)-halfW(k),cy(k));ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx(0)+halfW(0),cy(0));for(var l=1;l<nodes.length;l++)ctx.lineTo(cx(l)+halfW(l),cy(l));ctx.stroke();

  // Tributaries
  for(var ti=0;ti<nodes.length;ti++){
    var tok=tokens[ti],ox=cx(ti),oy=cy(ti),em=emphasis(ti),side=1;
    var alts=tok.alternatives.slice(0,5);
    for(var ai=0;ai<alts.length;ai++){
      var alt=alts[ai];if(alt.isSelected)continue;
      var isGhost=ai===0&&tokenDiverges(tok);
      var strength=Math.sqrt(alt.probability);
      var dist=w*(0.08+0.22*strength);
      var endX=ox+side*dist,endY=oy-ROW_H*0.34;
      var cpX=ox+side*dist*0.45,cpY=oy-ROW_H*0.08;
      side*=-1;
      var tColor=isGhost?"rgba(186,122,255,":"rgba(71,209,239,";
      var baseOp=(0.08+0.56*strength)*(0.28+0.72*em);
      var op=isGhost?Math.max(0.42,baseOp):Math.max(0.10,baseOp);
      ctx.beginPath();ctx.moveTo(ox,oy);ctx.quadraticCurveTo(cpX,cpY,endX,endY);
      ctx.strokeStyle=tColor+op+")";ctx.lineWidth=isGhost?3.2:1.0+2.3*strength;
      if(isGhost)ctx.setLineDash([6,3]);else ctx.setLineDash([]);ctx.lineCap="round";ctx.stroke();ctx.setLineDash([]);
      var r=1.5+2.5*strength;ctx.beginPath();ctx.arc(endX,endY,r,0,Math.PI*2);ctx.fillStyle=tColor+(op*0.9)+")";ctx.fill();
    }
  }

  // Spine
  for(var si=1;si<nodes.length;si++){
    var prob=tokens[si].selectedProbability,sem=emphasis(si);
    ctx.beginPath();ctx.moveTo(cx(si-1),cy(si-1));ctx.lineTo(cx(si),cy(si));
    ctx.strokeStyle=confidenceRGBA(prob,0.3+0.65*sem);ctx.lineWidth=1.4+2.1*prob;ctx.lineCap="round";ctx.stroke();
  }

  // Node stars
  for(var ni=0;ni<nodes.length;ni++){
    var ntok=tokens[ni],nx=cx(ni),ny=cy(ni),nem=emphasis(ni);
    var nr=3.5+4.5*Math.sqrt(ntok.selectedProbability);
    ctx.beginPath();ctx.arc(nx,ny,nr*2.6,0,Math.PI*2);ctx.fillStyle=confidenceRGBA(ntok.selectedProbability,0.13*(0.4+0.6*nem));ctx.fill();
    ctx.beginPath();ctx.arc(nx,ny,nr,0,Math.PI*2);ctx.fillStyle=confidenceRGBA(ntok.selectedProbability,0.5+0.5*nem);ctx.fill();
    if(ni===activeIndex){ctx.beginPath();ctx.arc(nx,ny,nr+6,0,Math.PI*2);ctx.strokeStyle="rgba(71,209,239,.95)";ctx.lineWidth=1.5;ctx.stroke();}
  }
}

function positionLabels(tokens,nodes){
  var wrap=document.getElementById("canvasWrap");
  wrap.querySelectorAll(".tok-label").forEach(function(el){el.remove();});
  var w=wrap.clientWidth;
  for(var i=0;i<tokens.length;i++){
    var tok=tokens[i],isActive=i===activeIdx;
    var el=document.createElement("div");
    el.className="tok-label"+(isActive?" active":"");
    el.textContent=readableText(tok.text);
    el.style.left=(nodes[i].x*w)+"px";
    el.style.top=(ROW_H*(i+0.5)+ROW_H*0.27)+"px";
    if(!isActive)el.style.opacity=String(0.28+0.42*tok.selectedProbability);
    el.dataset.index=i;
    el.addEventListener("click",function(e){var idx=parseInt(e.currentTarget.dataset.index);setActive(idx);scrollToToken(idx);});
    wrap.appendChild(el);
  }
}

function updateLabels(){
  document.querySelectorAll(".tok-label").forEach(function(el){
    var idx=parseInt(el.dataset.index),isActive=idx===activeIdx;
    el.className="tok-label"+(isActive?" active":"");
    el.style.opacity=isActive?"1":String(0.28+0.42*trace.tokens[idx].selectedProbability);
  });
}

function updateCard(tok,index){
  document.getElementById("cardTok").textContent=readableText(tok.text);
  document.getElementById("cardRaw").textContent="raw token · "+tok.text.replace(/\n/g,"\\n");
  var probEl=document.getElementById("cardProb");probEl.textContent=pct(tok.selectedProbability)+"%";probEl.style.color=confidenceCSS(tok.selectedProbability);
  document.getElementById("cardSub").textContent="Decision "+(index+1)+" of "+trace.tokens.length;
  document.getElementById("headerSub").textContent="Decision "+(index+1)+" of "+trace.tokens.length+" · scroll to follow";

  var start=Math.max(0,index-2),end=Math.min(trace.tokens.length-1,index+2),ctx="";
  for(var i=start;i<=end;i++){var raw=trace.tokens[i].text.replace(/\n/g," newline ");if(i===index){ctx+=(raw.startsWith(" ")?" ":"")+"<b>["+readableText(raw)+"]</b>";}else{ctx+=raw;}}
  document.getElementById("cardCtx").innerHTML=ctx;

  var insightEl=document.getElementById("cardInsight"),insightText=document.getElementById("cardInsightText"),icoEl=insightEl.querySelector(".i-ico");
  if(tokenDiverges(tok)){var ra=rawArgmax(tok);insightText.textContent='Sampling chose this current at '+pct(tok.selectedProbability)+'%; greedy decoding would choose "'+readableText(ra.text)+'" at '+pct(ra.probability)+'%.';insightEl.className="card-insight diverged";icoEl.textContent="⑂";}
  else if(tok.entropy>=2.5){insightText.textContent="Open water: many next tokens were plausible, even though this current won.";insightEl.className="card-insight";icoEl.textContent="~";}
  else if(tok.selectedProbability>=0.7){insightText.textContent="A strong current: the model treated this as the clear next token.";insightEl.className="card-insight";icoEl.textContent="~";}
  else{insightText.textContent="Several currents competed here; this token remained the strongest choice.";insightEl.className="card-insight";icoEl.textContent="~";}

  var surprise=-Math.log(Math.max(tok.selectedProbability,1e-6));
  document.getElementById("cardMetrics").innerHTML=
    '<div class="card-metric"><div class="card-metric-val">'+tok.entropy.toFixed(2)+' nats</div><div class="card-metric-lbl">entropy</div></div>'+
    '<div class="card-metric"><div class="card-metric-val">'+pct(tok.margin)+' pts</div><div class="card-metric-lbl">top margin</div></div>'+
    '<div class="card-metric"><div class="card-metric-val">'+surprise.toFixed(2)+' nats</div><div class="card-metric-lbl">surprisal</div></div>';

  var argmaxEl=document.getElementById("argmax");
  if(tokenDiverges(tok)){var raa=rawArgmax(tok);argmaxEl.innerHTML='<span class="diamond">&#9670;</span> Sampling left the strongest current, "'+readableText(raa.text)+'" at '+pct(raa.probability)+'%.';argmaxEl.style.display="block";}
  else{argmaxEl.style.display="none";}

  document.getElementById("altsHint").textContent=tok.alternatives.length>1?"top "+Math.min(6,tok.alternatives.length)+" + remainder":"";

  var altsEl=document.getElementById("altsRows");
  if(tok.alternatives.length>1){
    var displayed=tok.alternatives.slice(0,6);
    var remainder=Math.max(0,1-displayed.reduce(function(s,a){return s+a.probability;},0));
    var html=displayed.map(function(a,idx){
      var cls=a.isSelected?"sel":(idx===0?"top":"other");
      var badge=a.isSelected?"chosen":(idx===0?"top":"");
      var badgeColor=a.isSelected?"color:var(--blue)":(idx===0?"color:var(--fork)":"");
      var display=a.text.trim()||(a.text==="\n"?"newline":"space");
      return'<div class="alt-row"><span class="alt-text '+cls+'">'+display+'</span><div class="alt-bar"><div class="alt-fill '+cls+'" style="width:'+Math.max(2,a.probability*100)+'%"></div></div>'+(badge?'<span class="alt-badge" style="'+badgeColor+'">'+badge+'</span>':'<span class="alt-badge"></span>')+'<span class="alt-p">'+pct(a.probability)+'%</span></div>';
    }).join("");
    if(remainder>=0.005)html+='<div class="alt-row"><span class="alt-text">all other tokens</span><div class="alt-bar"><div class="alt-fill other" style="width:'+Math.max(2,remainder*100)+'%"></div></div><span class="alt-badge"></span><span class="alt-p">'+pct(remainder)+'%</span></div>';
    altsEl.innerHTML=html;document.getElementById("altsBtn").style.display="";
  }else{altsEl.innerHTML="";document.getElementById("altsBtn").style.display="none";}
}

function setActive(idx){
  idx=Math.max(0,Math.min(idx,trace.tokens.length-1));
  if(idx===activeIdx)return;activeIdx=idx;
  updateLabels();updateCard(trace.tokens[idx],idx);
  drawRiver(document.getElementById("riverCanvas"),trace.tokens,computeNodes(trace.tokens),idx);
}
function scrollToToken(idx){
  var scroll=document.getElementById("scroll");
  scroll.scrollTo({top:ROW_H*(idx+0.5)-scroll.clientHeight/2,behavior:"smooth"});
}

function buildAll(){
  var tokens=trace.tokens,nodes=computeNodes(tokens),canvas=document.getElementById("riverCanvas"),scroll=document.getElementById("scroll"),wrap=document.getElementById("canvasWrap");
  var padH=scroll.clientHeight/2;wrap.style.paddingTop=padH+"px";wrap.style.paddingBottom=padH+"px";
  drawRiver(canvas,tokens,nodes,activeIdx);positionLabels(tokens,nodes);updateCard(tokens[activeIdx],activeIdx);
}

var scrollEl=document.getElementById("scroll"),scrollTicking=false;
scrollEl.addEventListener("scroll",function(){
  if(scrollTicking)return;scrollTicking=true;
  requestAnimationFrame(function(){
    scrollTicking=false;var scroll=document.getElementById("scroll");
    var mid=scroll.scrollTop+scroll.clientHeight/2;var padH=scroll.clientHeight/2;
    var idx=Math.round((mid-padH)/ROW_H-0.5);
    idx=Math.max(0,Math.min(idx,trace.tokens.length-1));
    if(idx!==activeIdx)setActive(idx);
  });
});

document.getElementById("legendBtn").addEventListener("click",function(){
  legendVisible=!legendVisible;document.getElementById("legend").style.display=legendVisible?"":"none";
  document.getElementById("legendBtn").classList.toggle("active",legendVisible);
});
document.getElementById("altsBtn").addEventListener("click",function(){
  altsOpen=!altsOpen;document.getElementById("altsPanel").classList.toggle("open",altsOpen);
});
document.getElementById("loadBtn").addEventListener("click",function(){document.getElementById("fileInput").click();});
document.getElementById("fileInput").addEventListener("change",function(ev){
  var file=ev.target.files[0];if(!file)return;var reader=new FileReader();
  reader.onload=function(e){
    try{var json=JSON.parse(e.target.result);var tokens;
      if(json.traces){tokens=json.traces[Object.keys(json.traces)[0]];}
      else if(Array.isArray(json.tokens)){tokens=json.tokens;}
      else if(Array.isArray(json)){tokens=json;}
      if(tokens&&tokens.length){trace={tokens:tokens};activeIdx=0;altsOpen=false;document.getElementById("altsPanel").classList.remove("open");buildAll();scrollToToken(0);}
    }catch(err){console.error("Failed to parse trace JSON:",err);}
  };reader.readAsText(file);
});

var resizeTimer;
function handleResize(){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){
  var tokens=trace.tokens,nodes=computeNodes(tokens);
  drawRiver(document.getElementById("riverCanvas"),tokens,nodes,activeIdx);positionLabels(tokens,nodes);
},100);}
addEventListener("resize",handleResize);
buildAll();

})();
</script>
</body>
</html>
